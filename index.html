<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شارك موقعك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#16302b;--muted:#5c716c;--accent:#0f766e;--line:#cfdcd8;--err:#b42318;--ok:#0f766e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a18;--card:#152522;--ink:#e6f1ee;--muted:#93aaa4;--accent:#2dd4bf;--line:#28403b;--err:#f97066;--ok:#2dd4bf}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
h1{margin:0 0 6px;font-size:1.6rem;font-weight:800}
p.sub{margin:0 0 22px;color:var(--muted);line-height:1.7}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=tel]{width:100%;padding:12px 14px;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.loc{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:10px}
.loc button{width:100%}
#locStatus{margin:10px 0 0;font-size:.95rem;color:var(--muted)}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;padding:12px 16px;border:1px solid var(--accent);background:transparent;color:var(--accent)}
button.main{width:100%;margin-top:20px;background:var(--accent);color:var(--card);font-size:1.05rem}
button:disabled{opacity:.5;cursor:not-allowed}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:.92rem;color:var(--muted);line-height:1.6}
.consent input{margin-top:5px;accent-color:var(--accent)}
#msg{margin-top:14px;font-weight:600;min-height:1.5em}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
  <h1>شارك موقعك</h1>
  <p class="sub">املأ بياناتك واضغط على تحديد الموقع. المتصفح هيسألك الأول قبل ما يشارك مكانك.</p>

  <form id="f" novalidate>
    <input class="hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off">
    <label for="name">الاسم</label>
    <input id="name" name="name" type="text" autocomplete="name" required>

    <label for="phone">رقم التليفون</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" dir="ltr" style="text-align:right" autocomplete="tel" required>

    <div class="loc">
      <button type="button" id="locBtn">تحديد موقعي</button>
      <p id="locStatus" role="status">لسه ما اتحددش الموقع.</p>
    </div>

    <label class="consent">
      <input type="checkbox" id="ok">
      <span>أوافق إن اسمي ورقمي وموقعي يتبعتوا ويتحفظوا عند صاحب الصفحة عشان يتواصل معايا.</span>
    </label>

    <button class="main" id="send" type="submit">إرسال</button>
    <div id="msg" role="status"></div>
  </form>
</main>

<script>
// 1) سجّل في web3forms.com بإيميلك، وهيبعتلك مفتاح (Access Key). حطه هنا:
const ACCESS_KEY = "ضع_المفتاح_هنا";

const $ = id => document.getElementById(id);
let coords = null;

$("locBtn").onclick = () => {
  const s = $("locStatus");
  if (!navigator.geolocation) { s.textContent = "المتصفح ده مش بيدعم تحديد الموقع."; return; }
  s.textContent = "بنحدد موقعك...";
  navigator.geolocation.getCurrentPosition(p => {
    coords = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) };
    s.textContent = "تم تحديد الموقع ✓";
    s.style.color = "var(--ok)";
  }, e => {
    coords = null;
    s.style.color = "var(--err)";
    s.textContent = e.code === 1 ? "اترفض إذن الموقع. فعّله من إعدادات المتصفح وجرب تاني." : "ماقدرناش نحدد الموقع. جرب تاني.";
  }, { enableHighAccuracy: true, timeout: 15000 });
};

$("f").onsubmit = async ev => {
  ev.preventDefault();
  const msg = $("msg");
  msg.style.color = "var(--err)";
  const name = $("name").value.trim(), phone = $("phone").value.trim();
  if (!name || !phone) { msg.textContent = "اكتب الاسم ورقم التليفون."; return; }
  if (!/^\+?[0-9\s-]{7,15}$/.test(phone)) { msg.textContent = "رقم التليفون مش صحيح."; return; }
  if (!coords) { msg.textContent = "اضغط على تحديد موقعي الأول."; return; }
  if (!$("ok").checked) { msg.textContent = "لازم توافق على إرسال البيانات."; return; }
  if (ACCESS_KEY.includes("ضع")) { msg.textContent = "لسه ما حطيتش مفتاح Web3Forms في الكود."; return; }

  $("send").disabled = true; msg.style.color = "var(--muted)"; msg.textContent = "بنبعت...";
  try {
    const r = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        access_key: ACCESS_KEY,
        subject: "موقع جديد من " + name,
        name, phone,
        location_link: `https://www.google.com/maps?q=${coords.lat},${coords.lng}`,
        latitude: coords.lat, longitude: coords.lng, accuracy_m: coords.acc,
        botcheck: document.querySelector("[name=botcheck]").checked
      })
    });
    const d = await r.json();
    if (!d.success) throw 0;
    msg.style.color = "var(--ok)"; msg.textContent = "تم الإرسال. شكرًا ليك!";
    $("f").reset(); coords = null; $("locStatus").textContent = "لسه ما اتحددش الموقع."; $("locStatus").style.color = "";
  } catch (e) {
    msg.style.color = "var(--err)"; msg.textContent = "حصلت مشكلة في الإرسال. جرب تاني.";
  }
  $("send").disabled = false;
};
</script>
</body>
</html>
